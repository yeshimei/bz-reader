<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>原型 C · 想法收进工具条</title>
<link rel="stylesheet" href="base.css">
<style>
  /* 不画卡片；只在「想法」上点一颗小点，点开是带遮罩的弹窗 */
  .act.pri .dotmark{box-shadow:0 0 0 2px var(--card)}
</style>
</head>
<body data-mode="C">

<div class="proto-head">
  <span class="tag">手机 · 想法</span>
  <b>C 收进工具条</b>
  <span class="say">正文上不出现任何想法卡片，「想法」按钮右上角一颗小点表示这条线有想法；点开是带遮罩的弹窗，原文与想法都在里面。</span>
  <span class="sp"></span>
  <a href="index.html">← 四版对照</a>
</div>

<div class="stage">
  <div class="app" id="app">
    <header class="rhead">
      <button class="ib" title="返回">‹</button>
      <div class="meta"><b>夜读札记</b><span>第 7 章 · 灯下</span></div>
      <span class="sp"></span>
      <div class="themeswitch">
        <button data-theme-set="paper" class="on">纸</button>
        <button data-theme-set="ink">墨</button>
      </div>
    </header>
    <main class="page" id="page"><article class="prose" id="prose"></article></main>
    <footer class="rfoot"><span>23%</span><span class="bar"><i style="width:23%"></i></span><span>12 / 52</span></footer>

    <div class="scrim" id="scrim" hidden></div>
    <div class="stack" id="stack" hidden></div>
    <div class="dialog" id="dialog" hidden></div>
    <div class="ideacard" id="ideacard" hidden></div>
  </div>
</div>

<div class="proto-bar">
  <span class="lab">场景</span>
  <span id="scenes"></span>
  <span class="bar-sep"></span>
  <span class="state" id="state"></span>
</div>

<script src="base.js"></script>
</body>
</html>
