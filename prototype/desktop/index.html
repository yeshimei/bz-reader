<!doctype html>
<html lang="zh-CN" data-theme="ink">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bz 阅读 · Obsidian 内嵌原型</title>
<style>
/* ==========================================================
   bz 阅读 · Obsidian 内嵌原型 · 样式层
   墨与铜：暖炭 / 宣纸 / 夜棕 三主题；衬线管书，无衬线管事；
   一个强调色（铜金）；朱砂仅用于删除与警示。
   外壳模拟 Obsidian：ribbon / 左侧栏 / 中心 tab / 状态栏。
   ========================================================== */
:root{
  --bg:#141110; --bg-2:#181412; --bg-3:#1e1915;
  --glass:rgba(30,25,21,.80); --glass-line:rgba(233,214,181,.10);
  --surface:#1e1915; --surface-2:#251f19; --sunken:#0f0d0b;
  --line:rgba(233,214,181,.09); --line-2:rgba(233,214,181,.17);
  --t1:#ede4d4; --t2:#a2937d; --t3:#6b5f4e;
  --copper:#c8a464; --copper-soft:rgba(200,164,100,.14); --copper-line:rgba(200,164,100,.35);
  --ink:#f0e8d8; --ink-2:#c9bda6; --vermilion:#c25e4a;
  --ui:"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --serif:Georgia,"Times New Roman","STZhongsong","SimSun","Songti SC",serif;
  --sans:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  --shadow:0 18px 50px rgba(0,0,0,.5);
  --shadow-lg:0 36px 90px rgba(0,0,0,.65);
}
html[data-theme="paper"]{
  --bg:#efe9db; --bg-2:#e9e2d2; --bg-3:#f3eee3;
  --glass:rgba(247,243,234,.84); --glass-line:rgba(60,48,32,.10);
  --surface:#f7f3ea; --surface-2:#efeadf; --sunken:#e4dccb;
  --line:rgba(60,48,32,.11); --line-2:rgba(60,48,32,.20);
  --t1:#332b1f; --t2:#7d7057; --t3:#a3967c;
  --copper:#9a7434; --copper-soft:rgba(154,116,52,.12); --copper-line:rgba(154,116,52,.4);
  --ink:#2c2519; --ink-2:#5c5140; --vermilion:#a84a38;
  --shadow:0 18px 44px rgba(80,60,30,.18);
  --shadow-lg:0 36px 80px rgba(80,60,30,.26);
}
html[data-theme="sepia"]{
  --bg:#1a1611; --bg-2:#211b14; --bg-3:#2a2218;
  --glass:rgba(42,34,24,.82); --glass-line:rgba(233,214,181,.10);
  --surface:#2a2218; --surface-2:#33291c; --sunken:#141009;
  --line:rgba(233,214,181,.10); --line-2:rgba(233,214,181,.18);
  --t1:#ebdcc0; --t2:#b2a084; --t3:#7d6c4f;
  --copper:#d1a862; --copper-soft:rgba(209,168,98,.15); --copper-line:rgba(209,168,98,.4);
  --ink:#f2e5ca; --ink-2:#cdbb98; --vermilion:#c8674c;
  --shadow:0 18px 50px rgba(0,0,0,.55);
  --shadow-lg:0 36px 90px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--t1);font-family:var(--ui);-webkit-font-smoothing:antialiased;overflow:hidden;transition:background .35s ease,color .35s ease}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

/* ── 宿主窗口 ── */
.canvas{height:100vh;display:grid;place-items:center;padding:14px;background:var(--bg)}
.app{width:min(1480px,100%);height:min(940px,100%);display:flex;flex-direction:column;border:1px solid var(--line-2);border-radius:12px;overflow:hidden;background:var(--bg-2);box-shadow:var(--shadow-lg);position:relative}
.titlebar{height:36px;flex-shrink:0;display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--bg);border-bottom:1px solid var(--line)}
.dots{display:flex;gap:7px}
.dots i{width:9px;height:9px;border-radius:50%;display:block}
.dots i:nth-child(1){background:#c25e4a}.dots i:nth-child(2){background:#c8a464}.dots i:nth-child(3){background:#6f8f6a}
.tb-title{font-size:11.5px;color:var(--t2);letter-spacing:.08em}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:10.5px;color:var(--t3);letter-spacing:.08em}
.shell{flex:1;display:flex;min-height:0}

/* ── ribbon（Obsidian 左竖条） ── */
.ribbon{width:46px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0;background:var(--bg);border-right:1px solid var(--line)}
.rib{width:30px;height:30px;appearance:none;border:0;background:none;color:var(--t3);border-radius:7px;display:grid;place-items:center;transition:.18s;position:relative}
.rib:hover{color:var(--t1);background:var(--copper-soft)}
.rib.on{color:var(--copper);background:var(--copper-soft)}
.rib.on::before{content:"";position:absolute;left:-9px;top:8px;bottom:8px;width:2px;border-radius:0 2px 2px 0;background:var(--copper)}
.rib-sep{width:18px;height:1px;background:var(--line);margin:7px 0}
.rib-bot{margin-top:auto;display:flex;flex-direction:column;gap:2px}

/* ── 左侧栏 leaf ── */
.lefts{width:280px;flex-shrink:0;background:var(--bg);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.lefts.hide{display:none}
.lhead{display:flex;align-items:center;gap:8px;padding:12px 10px 0 14px;flex-shrink:0}
.lhead .t{font-size:11.5px;letter-spacing:.1em;color:var(--t3)}
.lhead .sp{flex:1}

/* ── 中心 tab 条 ── */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.tabbar{height:38px;flex-shrink:0;display:flex;align-items:flex-end;gap:2px;padding:0 8px;background:var(--bg);border-bottom:1px solid var(--line)}
.tab{position:relative;display:flex;align-items:center;gap:7px;height:30px;padding:0 8px 0 11px;border-radius:7px 7px 0 0;font-size:12px;color:var(--t3);cursor:pointer;max-width:236px;transition:.15s}
.tab:hover{background:var(--copper-soft);color:var(--t2)}
.tab.on{background:var(--bg-2);color:var(--t1)}
.tab .tico{font-family:var(--serif);font-size:12px;color:var(--copper);flex-shrink:0}
.tab .tname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab .x{appearance:none;border:0;background:none;color:inherit;font-size:13px;line-height:1;padding:2px 3px;border-radius:4px;opacity:0;flex-shrink:0}
.tab:hover .x,.tab.on .x{opacity:.55}
.tab .x:hover{opacity:1;background:var(--line-2)}
.tabbar .sp{flex:1}
.tabnew{appearance:none;border:0;background:none;color:var(--t3);width:24px;height:24px;border-radius:6px;font-size:15px;display:grid;place-items:center;margin-bottom:3px}
.tabnew:hover{color:var(--copper);background:var(--copper-soft)}
.stage{flex:1;min-height:0;position:relative;overflow:hidden}
.statusbar{height:26px;flex-shrink:0;display:flex;align-items:center;gap:14px;padding:0 16px;border-top:1px solid var(--line);background:var(--bg);font-size:10.5px;color:var(--t3);letter-spacing:.08em}
.statusbar .sp{flex:1}
.statusbar .dot{width:5px;height:5px;border-radius:50%;background:var(--copper);display:inline-block;margin-right:5px}

/* ── 书房（书库 / 笔记 / 统计） ── */
.studio{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg-2)}
.stuhead{flex-shrink:0;display:flex;align-items:flex-end;gap:24px;padding:20px 32px 0;border-bottom:1px solid var(--line)}
.stuhead .kick{font-size:10px;letter-spacing:.3em;color:var(--copper)}
.stuhead h1{font-family:var(--serif);font-weight:500;font-size:24px;letter-spacing:.22em;margin:6px 0 0}
.stunav{display:flex;gap:22px;margin-bottom:-1px}
.stunav button{position:relative;appearance:none;border:0;background:none;color:var(--t3);font-family:var(--serif);font-size:12.5px;letter-spacing:.16em;padding:9px 2px 13px;transition:.15s}
.stunav button:hover{color:var(--t2)}
.stunav button .n{font-size:9.5px;color:var(--t3);vertical-align:super;margin-left:3px}
.stunav button.on{color:var(--t1)}
.stunav button.on .n{color:var(--copper)}
.stunav button.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--copper)}
.stuhead .sp{flex:1}
.stuacts{display:flex;align-items:center;gap:6px;padding-bottom:9px}
.stubody{flex:1;overflow:auto;padding:22px 32px 44px}

/* ── 通用件 ── */
.cbtn{width:30px;height:30px;appearance:none;border:1px solid transparent;background:none;color:var(--t2);border-radius:8px;font-family:var(--serif);font-size:13.5px;display:grid;place-items:center;transition:.2s}
.cbtn:hover{color:var(--copper);border-color:var(--line-2);background:var(--copper-soft)}
.cbtn.on{color:var(--copper);border-color:var(--copper-line);background:var(--copper-soft)}
.cbtn.wide{width:auto;padding:0 12px;gap:6px;font-size:12px;font-family:var(--ui);letter-spacing:.1em;display:flex;align-items:center}
.ph{display:flex;align-items:flex-end;gap:18px;margin-bottom:22px}
.ph .kicker{font-size:10.5px;letter-spacing:.3em;color:var(--copper)}
.ph h1{font-family:var(--serif);font-weight:500;font-size:26px;letter-spacing:.04em;margin:8px 0 0}
.ph p{margin:0 0 4px;color:var(--t2);font-size:12.5px;line-height:1.8;max-width:520px}
.ph .sp{flex:1}
.btn{appearance:none;border:1px solid var(--line-2);background:transparent;color:var(--t2);border-radius:10px;padding:9px 16px;font-size:12.5px;letter-spacing:.08em;transition:.2s;white-space:nowrap}
.btn:hover{color:var(--t1);border-color:var(--copper-line);background:var(--copper-soft)}
.btn.pri{color:var(--copper);border-color:var(--copper-line);background:var(--copper-soft)}
.btn.pri:hover{color:var(--t1)}
.btn.sm{padding:6px 11px;font-size:11.5px;border-radius:8px}
.btn.danger:hover{color:var(--vermilion);border-color:var(--vermilion);background:transparent}
.chip{appearance:none;border:1px solid var(--line);background:none;color:var(--t3);border-radius:99px;padding:6px 13px;font-size:11.5px;letter-spacing:.1em;transition:.2s;white-space:nowrap}
.chip:hover{color:var(--t2)}
.chip.on{color:var(--copper);border-color:var(--copper-line);background:var(--copper-soft)}
.card{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:20px 22px}
.card.hair{border-top:2px solid var(--copper-line)}
.sect-h{display:flex;align-items:center;gap:10px;font-size:10.5px;letter-spacing:.3em;color:var(--t3);margin:26px 0 14px}
.sect-h .ln{flex:1;height:1px;background:var(--line)}
.sect-h b{font-family:var(--serif);font-weight:500;color:var(--copper);letter-spacing:.1em;font-size:12px}
.empty{color:var(--t3);font-size:13px;line-height:2;padding:40px 8px;text-align:center}
.badge{font-family:var(--serif);font-size:10px;color:var(--copper);border:1px solid var(--copper-line);border-radius:99px;padding:1px 7px;letter-spacing:.06em}
.mini{font-size:10.5px;color:var(--t3);letter-spacing:.08em}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv b{font-weight:500;color:var(--t1)}
.kv span{color:var(--t3)}

/* 封面 */
.cov{border-radius:5px;position:relative;overflow:hidden;display:grid;place-items:center;flex-shrink:0;color:#fff}
.cov::after{content:"";position:absolute;inset:0;box-shadow:inset 4px 0 9px rgba(0,0,0,.32)}
.cov .ct{font-family:var(--serif);writing-mode:vertical-rl;letter-spacing:.3em;font-size:15px;opacity:.94;z-index:1}
.cov .spine{position:absolute;left:5px;top:12%;bottom:12%;width:1px;background:rgba(255,255,255,.18);z-index:1}

/* ── 书库 ── */
.cont2{display:flex;gap:24px;align-items:center;border:1px solid var(--line-2);border-radius:16px;background:linear-gradient(120deg,var(--surface),var(--bg-3));padding:22px 26px;margin-bottom:24px;position:relative;overflow:hidden}
.cont2::after{content:"";position:absolute;right:-40px;top:-60px;width:220px;height:220px;border:1px solid var(--copper-soft);border-radius:50%}
.cont2 .cov{width:84px;height:122px;box-shadow:var(--shadow)}
.cont2 .ci{flex:1;min-width:0;z-index:1}
.cont2 .ci .kick{font-size:10.5px;letter-spacing:.3em;color:var(--copper)}
.cont2 .ci h2{font-family:var(--serif);font-weight:500;font-size:23px;margin:8px 0 4px;letter-spacing:.04em}
.cont2 .ci .sub{font-size:12px;color:var(--t3);letter-spacing:.06em}
.cont2 .prog{margin-top:16px;max-width:360px;display:flex;align-items:center;gap:14px}
.cont2 .prog .bar{flex:1;height:2px;background:var(--line);position:relative;border-radius:2px}
.cont2 .prog .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--copper)}
.cont2 .prog b{font-family:var(--serif);font-size:14px;color:var(--t1);font-weight:500;min-width:46px;text-align:right}
.cont2 .acts{display:flex;flex-direction:column;gap:10px;z-index:1}
.filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.well{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--sunken);border-radius:10px;padding:9px 13px;min-width:210px}
.well input{flex:1;min-width:0;border:0;background:none;outline:0;color:var(--t1);font-size:12.5px}
.well input::placeholder{color:var(--t3)}
.well svg{color:var(--t3);flex-shrink:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 20px}
.bkcard{appearance:none;border:0;background:none;text-align:left;padding:0;color:inherit;position:relative;display:block;width:100%;transition:.2s}
.bkcard .cov{width:100%;aspect-ratio:2/3;box-shadow:var(--shadow);transition:.2s}
.bkcard:hover .cov{transform:translateY(-5px);box-shadow:var(--shadow-lg)}
.bkcard .cov .ct{font-size:17px}
.bkcard .bi{padding:12px 2px 0}
.bkcard .bi b{display:block;font-family:var(--serif);font-weight:500;font-size:14px;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bkcard .bi .sub{display:block;font-size:11px;color:var(--t3);margin:5px 0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bkcard .bar{height:2px;background:var(--line);position:relative;border-radius:2px}
.bkcard .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--copper)}
.bkcard .meta{display:flex;align-items:center;justify-content:space-between;margin-top:7px;font-size:10.5px;color:var(--t3)}
.bkcard .meta em{font-style:normal;font-family:var(--serif);color:var(--t2)}
.bkcard .flag{position:absolute;right:8px;top:8px;z-index:2;font-size:10px;letter-spacing:.1em;color:var(--copper);border:1px solid var(--copper-line);background:var(--glass);border-radius:99px;padding:3px 8px;backdrop-filter:blur(8px)}
.bkcard .rowacts{position:absolute;left:8px;right:8px;bottom:74px;display:flex;gap:5px;opacity:0;transition:.2s;z-index:3}
.bkcard:hover .rowacts{opacity:1}
.bkcard .rowacts button{flex:1;border:1px solid var(--glass-line);background:var(--glass);backdrop-filter:blur(10px);color:var(--t1);font-size:10.5px;padding:5px 0;border-radius:7px}
.bkcard .rowacts button:hover{color:var(--copper);border-color:var(--copper-line)}
.bkcard.is-done .cov{filter:saturate(.55)}
.list{display:flex;flex-direction:column}
.bkrow2{display:flex;align-items:center;gap:16px;padding:12px 6px;border-bottom:1px solid var(--line);cursor:pointer;transition:.15s}
.bkrow2:hover{background:var(--copper-soft);border-radius:9px;border-bottom-color:transparent}
.bkrow2 .cov{width:38px;height:54px}
.bkrow2 .cov .ct{font-size:11px;letter-spacing:.08em;writing-mode:horizontal-tb}
.bkrow2 .bi{flex:1;min-width:0}
.bkrow2 .bi b{font-size:13.5px;font-weight:500;display:block}
.bkrow2 .bi .sub{font-size:10.5px;color:var(--t3);margin-top:3px}
.bkrow2 .bar{width:130px;height:2px;background:var(--line);position:relative;flex-shrink:0}
.bkrow2 .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--copper)}
.bkrow2 .pct{font-family:var(--serif);font-size:12px;color:var(--t2);width:44px;text-align:right;flex-shrink:0}
.bkrow2 .dt{font-size:10.5px;color:var(--t3);width:76px;text-align:right;flex-shrink:0}
.detail{display:grid;grid-template-columns:190px 1fr;gap:32px}
.detail .cov{width:190px;height:276px;box-shadow:var(--shadow-lg)}
.detail .cov .ct{font-size:22px}
.detail h2{font-family:var(--serif);font-weight:500;font-size:26px;margin:6px 0 8px;letter-spacing:.04em}
.detail .au{color:var(--t3);font-size:12.5px;letter-spacing:.1em}
.detail .desc{font-size:12.5px;line-height:2;color:var(--t2);margin:20px 0}
.detail .acts{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0 22px}
.detail .tocmini{display:flex;flex-wrap:wrap;gap:8px}

/* ── 阅读 ── */
.reader{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg-2)}
.rtool{position:absolute;left:0;right:0;top:0;z-index:8;display:flex;align-items:center;gap:5px;padding:8px 14px;background:var(--glass);backdrop-filter:blur(20px) saturate(1.2);border-bottom:1px solid var(--glass-line)}
.rtool .meta{display:flex;flex-direction:column;gap:2px;min-width:0;margin-right:4px}
.rtool .meta b{font-family:var(--serif);font-weight:500;font-size:14px;letter-spacing:.05em;white-space:nowrap}
.rtool .meta span{font-size:10px;color:var(--t3);letter-spacing:.1em}
.rtool .sp{flex:1}
.rtool .cbtn{width:27px;height:27px;font-size:13px;border-radius:7px}
.rpages{flex:1;min-height:0;overflow:auto;padding:74px 40px 88px;display:flex;justify-content:center;gap:0}
.reader.vertical .rpages{padding-top:78px}
.sheet{width:100%;color:var(--ink);flex-shrink:0;max-width:var(--rd-width,680px)}
.sheet .chhead{text-align:center;margin-bottom:42px}
.sheet .chhead .vol{font-size:11px;letter-spacing:.5em;color:var(--copper);margin-bottom:14px}
.sheet .chhead h3{font-family:var(--serif);font-weight:500;font-size:28px;margin:0;letter-spacing:.12em}
.sheet .chhead .rule{width:34px;height:1px;background:var(--copper);margin:22px auto 0;opacity:.8}
.sheet .para{margin:0 0 var(--rd-gap,1.55em);text-align:var(--rd-align,justify);white-space:normal;font-family:var(--rd-font,var(--serif));font-size:var(--rd-size,18.5px);line-height:var(--rd-leading,2.05);letter-spacing:.015em}
.sheet.two-col{column-count:2;column-gap:48px;width:100%;max-width:min(1080px,100%)}
.sheet.two-col .chhead{column-span:all}
.sheet .para.first::first-letter{font-size:52px;line-height:1;float:left;padding:8px 12px 0 0;color:var(--copper)}
.sheet .para .hl{background:linear-gradient(transparent 58%,var(--c-soft) 58%);box-shadow:inset 0 -1px 0 var(--c);border-bottom:1px solid var(--c);border-radius:1px;padding:0 1px;cursor:pointer;color:inherit}
.sheet .para .hl.note::after{content:"✎";font-size:11px;color:var(--c);vertical-align:super;margin-left:2px}
.sheet .para.speaking{text-decoration:underline;text-decoration-color:var(--copper);text-underline-offset:5px;text-decoration-thickness:1px}
.sheet.vertical{writing-mode:vertical-rl;text-orientation:mixed;height:100%;max-width:none}
.sheet.vertical .para{text-align:justify;margin:0 0 0 1.7em}
.sheet.vertical .chhead{writing-mode:horizontal-tb;margin:0 auto 30px}
.sheet.vertical .chhead h3{font-size:24px}
.sheet.scrollmode{border:0}
.parallel{display:flex;gap:0;width:100%;justify-content:center}
.parallel .sheet{border-right:1px solid var(--line);padding-right:36px}
.parallel .sheet:last-child{border-right:0;padding-right:0;padding-left:36px}
.parallel .sheet .chhead h3{font-size:22px}
.parallel .para{font-size:.86em}
.plabel{font-size:10px;letter-spacing:.24em;color:var(--copper);margin-bottom:16px;display:block}
.rfoot{position:absolute;left:0;right:0;bottom:0;z-index:8;display:flex;align-items:center;gap:16px;padding:11px 20px 13px;background:var(--glass);backdrop-filter:blur(20px) saturate(1.2);border-top:1px solid var(--glass-line)}
.rfoot .chap{font-size:11.5px;color:var(--t2);letter-spacing:.06em;white-space:nowrap;min-width:130px}
.rfoot .track{flex:1;position:relative;height:20px;cursor:pointer}
.rfoot .track::before{content:"";position:absolute;left:0;right:0;top:10px;height:1px;background:var(--line-2)}
.rfoot .fill{position:absolute;left:0;top:9px;height:2px;background:linear-gradient(90deg,transparent,var(--copper))}
.rfoot .knob{position:absolute;top:10px;width:9px;height:9px;border-radius:50%;background:var(--copper);transform:translate(-50%,-50%);box-shadow:0 0 0 4px var(--copper-soft)}
.rfoot .pct{font-family:var(--serif);font-size:13px;color:var(--t1);min-width:48px;text-align:right;letter-spacing:.04em}
.rfoot .left{font-size:10.5px;color:var(--t3);white-space:nowrap;min-width:74px;text-align:right}
.rfoot .nav{appearance:none;border:1px solid var(--line);background:none;color:var(--t2);width:27px;height:27px;border-radius:8px;font-size:13px;display:grid;place-items:center}
.rfoot .nav:hover{color:var(--copper);border-color:var(--copper-line)}
.ttsbar{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);z-index:9;display:flex;align-items:center;gap:14px;padding:9px 18px;border-radius:99px;background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--glass-line);box-shadow:var(--shadow);font-size:11.5px;color:var(--t2);letter-spacing:.08em}
.ttsbar button{appearance:none;border:0;background:none;color:var(--copper);font-size:12px}
.ttsbar .wave{display:flex;gap:2px;align-items:center;height:14px}
.ttsbar .wave i{width:2px;background:var(--copper);display:block;animation:wv 1s ease-in-out infinite alternate}
.ttsbar .wave i:nth-child(1){height:6px;animation-delay:0s}.ttsbar .wave i:nth-child(2){height:12px;animation-delay:.2s}.ttsbar .wave i:nth-child(3){height:8px;animation-delay:.4s}.ttsbar .wave i:nth-child(4){height:14px;animation-delay:.1s}.ttsbar .wave i:nth-child(5){height:5px;animation-delay:.3s}
@keyframes wv{to{height:3px;opacity:.5}}
.ttsbar.paused .wave i{animation-play-state:paused;opacity:.4}

/* ── 左侧栏内容 ── */
.sbhead{display:flex;align-items:center;gap:10px;padding:10px 14px 0}
.sbhead b{font-family:var(--serif);font-size:14px;font-weight:500;letter-spacing:.1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbhead .sp{flex:1}
.sbtabs{display:flex;gap:0;justify-content:space-between;padding:0 14px;margin-top:8px;border-bottom:1px solid var(--line);flex-shrink:0}
.sbtab{appearance:none;background:none;border:0;cursor:pointer;position:relative;padding:8px 0 10px;font-family:var(--serif);font-size:11.5px;letter-spacing:.1em;color:var(--t3)}
.sbtab .n{font-size:9.5px;color:var(--t3);vertical-align:super;margin-left:3px}
.sbtab.on{color:var(--t1)}
.sbtab.on .n{color:var(--copper)}
.sbtab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--copper)}
.sbbody{flex:1;overflow:auto;padding:8px 10px 24px}
.sbbody::-webkit-scrollbar{width:0}
.sbsec{font-size:10px;letter-spacing:.28em;color:var(--t3);padding:12px 6px 8px}
.chaprow{position:relative;display:flex;align-items:center;gap:10px;width:100%;text-align:left;appearance:none;border:0;background:none;padding:10px 8px;border-radius:8px;cursor:pointer;transition:.15s}
.chaprow:hover{background:var(--copper-soft)}
.chaprow .no{font-family:var(--serif);font-size:10.5px;color:var(--t3);width:24px;flex-shrink:0;letter-spacing:.08em}
.chaprow .t{flex:1;min-width:0;font-size:12.5px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.03em}
.chaprow .pc{font-family:var(--serif);font-size:10px;color:var(--t3)}
.chaprow.on{background:var(--copper-soft)}
.chaprow.on::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:2px;background:var(--copper)}
.chaprow.on .t{color:var(--t1)}
.chaprow.on .no,.chaprow.on .pc{color:var(--copper)}
.chaprow.d1{padding-left:30px}
.chaprow.d1 .no{width:16px;font-size:10px}
.mkrow{position:relative;display:flex;align-items:baseline;gap:8px;padding:12px 24px 12px 24px;cursor:pointer;border-radius:8px}
.mkrow::before{content:"";position:absolute;left:10px;top:50%;width:6px;height:6px;background:var(--copper);transform:translateY(-50%) rotate(45deg)}
.mkrow:hover{background:var(--copper-soft)}
.mkrow .tt{font-size:12.5px;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mkrow .pc{font-family:var(--serif);font-size:10px;color:var(--t3)}
.mkrow .sp{flex:1}
.mkrow em{font-style:normal;font-family:var(--serif);font-size:10.5px;color:var(--t3)}
.mkrow .x{appearance:none;border:0;background:none;color:var(--t3);opacity:0;position:absolute;right:4px;top:50%;transform:translateY(-50%);font-size:13px}
.mkrow:hover .x{opacity:1}
.mkrow .x:hover{color:var(--vermilion)}
.timeline{position:relative}
.timeline::before{content:"";position:absolute;left:12px;top:16px;bottom:16px;width:1px;background:var(--line-2)}
.hlgroup{margin-bottom:8px}
.hlg-h{display:flex;align-items:center;gap:8px;padding:12px 6px 6px;font-size:10px;letter-spacing:.26em;color:var(--t3)}
.hlg-h .n{font-family:var(--serif);font-size:10.5px;color:var(--copper)}
.hlg-h .ln{flex:1;height:1px;background:var(--line)}
.hlit{position:relative;padding:10px 24px 10px 12px;border-top:1px solid var(--line);cursor:pointer;border-radius:0 8px 8px 0}
.hlit:hover{background:var(--copper-soft)}
.hlit::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:2px;background:var(--c);border-radius:1px}
.hlit .tx{font-family:var(--serif);font-size:12.5px;line-height:1.85;color:var(--ink);display:block}
.hlit .cm{display:flex;gap:7px;margin-top:6px;font-size:11.5px;line-height:1.7;color:var(--t2)}
.hlit .cm b{font-size:9.5px;letter-spacing:.24em;color:var(--copper);font-weight:400;flex-shrink:0;padding-top:2px}
.hlit .x{appearance:none;border:0;background:none;color:var(--t3);opacity:0;position:absolute;right:4px;top:9px;font-size:13px}
.hlit:hover .x{opacity:1}
.hlit .x:hover{color:var(--vermilion)}
.aichat{display:flex;flex-direction:column;gap:12px;padding:12px 4px}
.aibubble{border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:12px;line-height:1.85;color:var(--t2)}
.aibubble.me{background:var(--copper-soft);color:var(--t1);align-self:flex-end;max-width:88%;border-color:var(--copper-line)}
.aibubble .tag{font-size:9.5px;letter-spacing:.24em;color:var(--copper);display:block;margin-bottom:6px}
.aiask{display:flex;gap:6px;margin-top:6px}
.aiask input{flex:1;border:1px solid var(--line);background:var(--sunken);color:var(--t1);border-radius:8px;padding:8px 10px;outline:0;font-size:12px}

/* 划词浮层 */
.selbar{position:absolute;z-index:30;display:flex;align-items:center;gap:5px;padding:7px 9px;border-radius:13px;background:var(--glass);backdrop-filter:blur(22px) saturate(1.3);border:1px solid var(--glass-line);box-shadow:var(--shadow-lg)}
.pendot{width:18px;height:18px;border-radius:50%;cursor:pointer;position:relative;border:1px solid rgba(0,0,0,.3);transition:.15s}
.pendot:hover{transform:scale(1.15)}
.pendot.on::after{content:"";position:absolute;inset:-4px;border:1px solid var(--t2);border-radius:50%}
.selbar .div{width:1px;height:18px;background:var(--line-2);margin:0 3px}
.sbtn{appearance:none;border:0;background:none;color:var(--t2);font:11.5px var(--ui);padding:7px 8px;border-radius:8px;white-space:nowrap;letter-spacing:.04em}
.sbtn:hover{color:var(--copper);background:var(--copper-soft)}

/* ── 笔记（跨书） ── */
.noteshead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.nbook{margin-bottom:24px}
.nbook-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.nbook-h b{font-family:var(--serif);font-size:15px;font-weight:500}
.nbook-h .sp{flex:1}
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.ncard{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--surface);position:relative;border-left:2px solid var(--c)}
.ncard .tx{font-family:var(--serif);font-size:13px;line-height:1.9;color:var(--ink)}
.ncard .cm{margin-top:9px;font-size:12px;line-height:1.75;color:var(--t2);border-top:1px solid var(--line);padding-top:9px}
.ncard .cm b{font-size:9.5px;letter-spacing:.24em;color:var(--copper);font-weight:400;display:block;margin-bottom:4px}
.ncard .loc{font-size:10px;color:var(--t3);margin-top:9px;letter-spacing:.08em;display:flex;gap:8px;align-items:center}
.ncard .loc button{appearance:none;border:0;background:none;color:var(--copper);font-size:10px;padding:0}
.review{border:1px solid var(--copper-line);background:var(--copper-soft);border-radius:14px;padding:18px 22px;margin-bottom:22px}
.review .kick{font-size:10px;letter-spacing:.3em;color:var(--copper)}
.review h3{font-family:var(--serif);font-weight:500;font-size:17px;margin:8px 0 10px}
.review .q{font-family:var(--serif);font-size:13.5px;line-height:1.9;color:var(--ink);min-height:52px}
.review .acts{display:flex;gap:8px;margin-top:14px;align-items:center}
.review .idx{font-family:var(--serif);font-size:11px;color:var(--t3);margin-left:auto}

/* ── 统计 ── */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:22px}
.kpis .k{background:var(--surface);padding:16px 20px}
.kpis .k b{display:block;font-family:var(--serif);font-size:27px;font-weight:500;color:var(--copper);letter-spacing:.02em}
.kpis .k span{font-size:10.5px;color:var(--t3);letter-spacing:.16em}
.stats-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}
.goal{display:flex;align-items:center;gap:24px}
.goal svg{flex-shrink:0}
.goal .gi b{font-family:var(--serif);font-size:17px;display:block;margin-bottom:6px;font-weight:500}
.goal .gi span{font-size:11.5px;color:var(--t2);line-height:1.8;display:block}
.heat{display:grid;grid-template-columns:repeat(20,1fr);gap:3px;margin-top:12px}
.heat i{aspect-ratio:1;border-radius:2px;background:var(--surface-2);display:block}
.heat i.l1{background:var(--copper-soft)}.heat i.l2{background:rgba(200,164,100,.32)}.heat i.l3{background:rgba(200,164,100,.58)}.heat i.l4{background:var(--copper)}
.heat-axis{display:flex;justify-content:space-between;font-size:9.5px;color:var(--t3);letter-spacing:.1em;margin-top:8px}
.bars{display:flex;align-items:flex-end;gap:10px;height:126px;margin-top:16px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.bars .b i{width:100%;background:linear-gradient(180deg,var(--copper),var(--copper-soft));border-radius:3px 3px 0 0;display:block;min-height:3px}
.bars .b span{font-size:9.5px;color:var(--t3);white-space:nowrap}
.rank{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.rank .r{display:flex;align-items:center;gap:12px;font-size:12px}
.rank .r .nm{width:112px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--t2);flex-shrink:0}
.rank .r .bar{flex:1;height:5px;background:var(--line);border-radius:3px;position:relative}
.rank .r .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--copper);border-radius:3px}
.rank .r em{font-style:normal;font-family:var(--serif);color:var(--t3);width:52px;text-align:right;flex-shrink:0}

/* ── 设置（模拟 Obsidian 设置面板） ── */
.obs-set{width:min(920px,100%);height:min(680px,92%);display:flex;background:var(--bg-2);border:1px solid var(--glass-line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow-lg)}
.oset-side{width:206px;flex-shrink:0;background:var(--bg);border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.oset-t{font-family:var(--serif);font-size:12.5px;letter-spacing:.22em;color:var(--t2);padding:0 10px 12px}
.oset-side button{appearance:none;border:0;background:none;color:var(--t3);text-align:left;padding:8px 10px;border-radius:7px;font-size:12.5px;transition:.15s}
.oset-side button:hover{background:var(--copper-soft);color:var(--t1)}
.oset-side button.on{background:var(--copper-soft);color:var(--copper)}
.oset-main{flex:1;display:flex;flex-direction:column;min-width:0}
.oset-head{display:flex;align-items:center;gap:12px;padding:15px 24px;border-bottom:1px solid var(--line);flex-shrink:0}
.oset-head b{font-family:var(--serif);font-size:16px;font-weight:500;letter-spacing:.1em}
.oset-head .n{font-size:10.5px;color:var(--t3);letter-spacing:.12em}
.oset-head .sp{flex:1}
.oset-head .x{appearance:none;border:0;background:none;color:var(--t3);font-size:17px;width:26px;height:26px;border-radius:7px}
.oset-head .x:hover{color:var(--t1);background:var(--copper-soft)}
.oset-body{flex:1;overflow:auto;padding:18px 24px 34px}

/* ── 设置分组（复用） ── */
.set-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.setgrp{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:16px 18px}
.setgrp.flat{border:0;background:none;padding:0;border-radius:0}
.setgrp h3{font-family:var(--serif);font-size:15px;font-weight:500;margin:0 0 4px;letter-spacing:.06em}
.setgrp .hint{font-size:11px;color:var(--t3);line-height:1.8;margin:0 0 14px}
.setrow{display:flex;align-items:center;gap:14px;padding:9px 0;border-top:1px solid var(--line);font-size:12.5px}
.setrow label{color:var(--t2);width:86px;flex-shrink:0;letter-spacing:.05em}
.setrow .val{font-family:var(--serif);font-size:12px;color:var(--copper);width:52px;text-align:right;flex-shrink:0}
.setrow input[type=range]{flex:1;accent-color:var(--copper);height:2px}
.seg{display:flex;gap:3px;padding:3px;border:1px solid var(--line);border-radius:9px;background:var(--sunken);flex:1}
.seg button{flex:1;appearance:none;border:0;background:none;color:var(--t3);font-size:11.5px;padding:6px 4px;border-radius:6px;white-space:nowrap}
.seg button.on{background:var(--copper-soft);color:var(--copper)}
select,input[type=text],input[type=password],textarea{background:var(--sunken);border:1px solid var(--line);color:var(--t1);border-radius:8px;padding:8px 10px;font-size:12px;outline:0}
select:focus,input:focus,textarea:focus{border-color:var(--copper-line)}
.setrow select{flex:1}
.switch{margin-left:auto;width:36px;height:20px;border-radius:99px;border:1px solid var(--line-2);background:var(--sunken);position:relative;flex-shrink:0;appearance:none;transition:.2s}
.switch::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--t3);transition:.2s}
.switch.on{background:var(--copper-soft);border-color:var(--copper-line)}
.switch.on::after{left:18px;background:var(--copper)}

/* ── 弹层 ── */
.scrim{position:absolute;inset:0;z-index:40;--overlay:rgba(0,0,0,.55);background:var(--overlay);backdrop-filter:blur(3px);display:grid;place-items:center;padding:28px}
html[data-theme="paper"] .scrim{--overlay:rgba(40,30,15,.38)}
.modal{width:min(560px,100%);max-height:min(720px,88%);display:flex;flex-direction:column;background:var(--glass);backdrop-filter:blur(26px) saturate(1.25);border:1px solid var(--glass-line);border-radius:16px;box-shadow:var(--shadow-lg);overflow:hidden}
.modal.wide{width:min(760px,100%)}
.modal.tall{max-height:min(820px,92%)}
.mhead{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);flex-shrink:0}
.mhead b{font-family:var(--serif);font-size:16px;font-weight:500;letter-spacing:.08em}
.mhead .n{font-size:10.5px;color:var(--t3);letter-spacing:.14em}
.mhead .sp{flex:1}
.mhead .x{appearance:none;border:0;background:none;color:var(--t3);font-size:17px;width:26px;height:26px;border-radius:7px}
.mhead .x:hover{color:var(--t1);background:var(--copper-soft)}
.mbody{padding:18px 20px;overflow:auto;flex:1}
.mfoot{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-shrink:0}
.mfoot .sp{flex:1}
.search-in{display:flex;align-items:center;gap:10px;border:1px solid var(--line-2);border-radius:11px;background:var(--sunken);padding:11px 14px;margin-bottom:12px}
.search-in input{flex:1;border:0;background:none;color:var(--t1);font-size:14px;outline:0}
.hit{display:block;width:100%;text-align:left;appearance:none;border:0;background:none;color:var(--t2);font-size:12.5px;line-height:1.9;padding:10px 12px;border-radius:10px;cursor:pointer}
.hit:hover{background:var(--copper-soft)}
.hit .loc{display:block;font-size:10px;color:var(--t3);letter-spacing:.1em;margin-bottom:3px}
.hit em{font-style:normal;color:var(--copper);border-bottom:1px solid var(--copper-line)}
.hitgroup{font-size:10px;letter-spacing:.26em;color:var(--copper);padding:14px 10px 4px}
.drop{border:1px dashed var(--line-2);border-radius:14px;padding:44px 20px;text-align:center;color:var(--t3);font-size:12.5px;line-height:2;transition:.2s}
.drop.over{border-color:var(--copper);background:var(--copper-soft);color:var(--copper)}
.drop b{display:block;font-family:var(--serif);font-size:17px;color:var(--t1);font-weight:500;margin-bottom:6px}
.md{background:var(--sunken);border:1px solid var(--line);border-radius:10px;padding:16px;font:12px/1.9 var(--ui);color:var(--t2);white-space:pre-wrap;max-height:340px;overflow:auto}
.tour{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tour button{display:flex;align-items:center;gap:10px;text-align:left;appearance:none;border:1px solid var(--line);background:none;color:var(--t2);border-radius:10px;padding:11px 13px;font-size:12px;transition:.2s}
.tour button:hover{border-color:var(--copper-line);background:var(--copper-soft);color:var(--t1)}
.tour button b{font-family:var(--serif);color:var(--copper);font-size:14px;font-weight:500;width:22px}
.tour button span{font-size:10px;color:var(--t3);display:block;margin-top:2px}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:8px 22px;margin-top:8px}
.keys div{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--t2);border-bottom:1px solid var(--line);padding:8px 0}
.keys kbd{font:10.5px var(--ui);color:var(--copper);border:1px solid var(--copper-line);border-radius:5px;padding:2px 7px;background:var(--copper-soft)}
.srcnote{font-size:11px;color:var(--t3);line-height:1.9;margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.srcnote b{color:var(--copper);font-weight:500}

/* AI / 书摘 / 想法 / 词典 */
.ai-tag{display:flex;align-items:center;gap:9px;margin-bottom:4px}
.ai-tag .seal{width:26px;height:26px;border-radius:7px;background:var(--copper-soft);border:1px solid var(--copper-line);color:var(--copper);display:grid;place-items:center;font-family:var(--serif);font-size:13px}
.ai-tag b{font-size:11px;letter-spacing:.24em;color:var(--copper)}
.ai-quote{margin:12px 0;padding:2px 0 2px 13px;border-left:2px solid var(--copper-line);font-family:var(--serif);font-size:12.5px;line-height:1.9;color:var(--t2)}
.ai-body{font-size:13px;line-height:1.95;color:var(--ink-2)}
.ai-src{font-size:10.5px;color:var(--t3);letter-spacing:.06em;margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.ai-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.qcard{position:relative;border:1px solid var(--line-2);border-radius:12px;padding:20px 22px;background:var(--surface);border-left:3px solid var(--copper)}
.qcard .q{font-family:var(--serif);font-size:16px;line-height:2;color:var(--ink)}
.qcard .q::before{content:"「";color:var(--copper)}.qcard .q::after{content:"」";color:var(--copper)}
.qcard .loc{font-size:11px;color:var(--t3);margin-top:14px;letter-spacing:.08em}
.qcard .stamp{position:absolute;right:18px;bottom:16px;font-family:var(--serif);font-size:11px;color:var(--copper);border:1px solid currentColor;border-radius:4px;padding:2px 6px;letter-spacing:.08em}

/* ─────────── 工具 ─────────── */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function $(sel){ return document.querySelector(sel); }
function uid(p){ return p + Math.random().toString(36).slice(2,8); }
function clamp(n,a,b){ return Math.min(b,Math.max(a,n)); }
function penOf(v){ return PENS.find(p=>p.v===v) || PENS[0]; }
function book(id){ return S.books.find(b=>b.id===id) || S.books[0]; }
function totalPages(b){ return b.chapters.length*3; }
function pageNo(){ return S.chapter*3 + S.page; }
function chapterTitle(b,ch){ return b.chapters[ch] || '（未命名章节）'; }
function absOf(ch,pg,i){ return (ch*3+pg)*2+i; }
function relOf(b,abs){ return (abs + b.seed) % PARAS.length; }
function paraAt(b,abs){ return PARAS[relOf(b,abs)]; }
function absToPos(abs){ return { ch:Math.floor(abs/6), pg:Math.floor((abs%6)/2) }; }
function pctOf(b){ return Math.round(((S.chapter*3+S.page+1)/totalPages(b))*100); }
function fmtDate(ts){ const d=new Date(ts); return `${d.getMonth()+1}月${d.getDate()}日`; }
function toast(msg){

}

function decorate(text, abs, bookId){
  let out = esc(text);
  const ms = (S.marks[bookId]||[]).filter(m=>m.abs===abs && text.includes(m.text)).sort((a,b)=>b.text.length-a.text.length);
  const slots=[];
  ms.forEach((m,i)=>{
    const t=esc(m.text);
    if(out.includes(t)){ out=out.replace(t,`\u0001${i}\u0001`); slots.push(m); }
  });
  slots.forEach((m,i)=>{
    out=out.replace(`\u0001${i}\u0001`,`<mark class="hl${m.comment?' note':''}" style="--c:${penOf(m.color).css};--c-soft:${penOf(m.color).soft}" data-act="hlcard" data-id="${m.id}">${esc(m.text)}</mark>`);
  });
  return out;
}
function sheetHtml(b,ch,pg,opt){
  const paras=[];
  const list = opt.scroll ? Array.from({length:6},(_,i)=>absOf(ch,0,0)+i) : [absOf(ch,pg,0),absOf(ch,pg,1)];
  for(const abs of list){
    const text=paraAt(b,abs);
    paras.push(`<p class="para${opt.first&&abs===list[0]?' first':''}${RT.tts&&abs===list[0]?' speaking':''}" data-abs="${abs}">${decorate(text,abs,b.id)}</p>`);
  }
  const head = (pg===0||opt.scroll) ? `<div class="chhead"><div class="vol">第 ${cn(ch+1)} 章</div><h3>${esc(chapterTitle(b,ch))}</h3><div class="rule"></div></div>` : '';
  const cls=['sheet',S.settings.vertical?'vertical':'',S.settings.columns===2?'two-col':'',S.settings.mode==='scroll'?'scrollmode':''].filter(Boolean).join(' ');
  return `<div class="${cls}">${opt.label?`<span class="plabel">${esc(opt.label)}</span>`:''}${head}${paras.join('')}</div>`;
}
function cn(n){
  const d=['一','二','三','四','五','六','七','八','九','十'];
  if(n<=10)return d[n-1]||String(n);
  if(n<20)return '十'+(d[n-11]||'');
  return String(n);
}

function sideBody(b){
  const tab=S.sideTab;

    });
    return `<div class="sbsec">当前 · 第 ${cn(S.chapter+1)} 章</div>${out}`;
  }
  if(tab==='bookmarks'){
    const ks=[...(S.bookmarks[b.id]||[])].sort((a,c)=>a.ch*3+a.pg-(c.ch*3+c.pg));
    if(!ks.length)return `<div class="empty">还没有书签。<br>读到的地方，点阅读栏「签」记一枚。</div>`;
    return `<div class="sbsec">按书中先后</div><div class="timeline">${ks.map(k=>`<div class="mkrow" data-act="jumpbookmark" data-id="${k.id}"><span class="tt">${esc(k.label)}</span><span class="pc">${Math.round((k.ch*3+k.pg+1)/totalPages(b)*100)}%</span><span class="sp"></span><em>${fmtDate(k.date)}</em><button class="x" data-act="delbookmark" data-id="${k.id}" title="删除">×</button></div>`).join('')}</div>`;
  }
  if(tab==='highlights'){
    const ms=S.marks[b.id]||[];
    if(!ms.length)return `<div class="empty">还没有划线。<br>在正文里选中一段文字，浮出的色点里挑一支笔。</div>`;
    const groups={}; ms.forEach(m=>{const t=chapterTitle(b,m.ch);(groups[t]||(groups[t]=[])).push(m);});
    return Object.entries(groups).map(([t,arr])=>`<div class="hlgroup"><div class="hlg-h"><span>${esc(t)}</span><span class="n">${arr.length}</span><span class="ln"></span></div>
      ${arr.map(m=>`<div class="hlit" style="--c:${penOf(m.color).css}" data-act="hlcard" data-id="${m.id}"><span class="tx">${esc(m.text)}</span>${m.comment?`<span class="cm"><b>想法</b>${esc(m.comment)}</span>`:''}<button class="x" data-act="delmark" data-id="${m.id}" title="删除">×</button></div>`).join('')}</div>`).join('');
  }
  const log=RT.aiLog.length?RT.aiLog:[{me:false,tag:'AI · 可由本地模型作答',text:'选中一段文字，点划词浮层里的「AI 解释」；或直接在这本书里问一个问题。回答只会引用你当前位置之前的内容，不剧透后面。'}];
  return `<div class="aichat">${log.map(m=>`<div class="aibubble${m.me?' me':''}"><span class="tag">${m.me?'我':esc(m.tag)}</span>${esc(m.text)}</div>`).join('')}
    <div class="aiask"><input data-role="aiask" placeholder="问这本书…" value=""><button class="btn sm pri" data-act="aiask">问</button></div>
    <div class="mini" style="padding:6px 2px">仅看当前位置之前 · 服务商：${esc(S.settings.aiProvider)}</div></div>`;
}

function libBooks(){
  let arr=[...S.books];
  const k=S.libKw.trim().toLowerCase();
  if(k)arr=arr.filter(b=>(b.title+b.author+b.tags.join('')).toLowerCase().includes(k));
  if(S.libShelf!=='全部')arr=arr.filter(b=>b.shelf===S.libShelf);
  if(S.libFilter==='reading')arr=arr.filter(b=>b.status==='reading');
  if(S.libFilter==='done')arr=arr.filter(b=>b.status==='done');
  if(S.libFilter==='new')arr=arr.filter(b=>b.status==='new');
  if(S.libFilter==='fav')arr=arr.filter(b=>b.fav);
  if(S.libSort==='recent')arr.sort((a,b)=>(b.last==='今天'?9:0)-(a.last==='今天'?9:0)||b.percent-a.percent);
  if(S.libSort==='title')arr.sort((a,b)=>a.title.localeCompare(b.title,'zh'));
  if(S.libSort==='progress')arr.sort((a,b)=>b.percent-a.percent);
  return arr;
}

    <button class="chip${S.libView==='grid'?' on':''}" data-act="libview" data-v="grid">封面墙</button><button class="chip${S.libView==='list'?' on':''}" data-act="libview" data-v="list">列表</button>

/* ─────────── 笔记 ─────────── */
function allMarks(){
  const out=[];
  for(const b of S.books)for(const m of (S.marks[b.id]||[]))out.push({b,m});
  return out;
}
function noteCardHtml(b,m,showLoc){
  return `<div class="ncard" style="--c:${penOf(m.color).css}">
    <div class="tx">${esc(m.text)}</div>
    ${m.comment?`<div class="cm"><b>${esc(m.type||'想法')}</b>${esc(m.comment)}</div>`:''}

  </div>`;
}
function viewNotes(){
  const all=allMarks();
  const kw=S.noteKw.trim().toLowerCase();
  let arr=all.filter(({b,m})=>(!kw||(m.text+m.comment+b.title).toLowerCase().includes(kw)) && (S.noteFilter==='all'||m.comment||m.color===S.noteFilter));
  const groups={}; arr.forEach(x=>(groups[x.b.id]||(groups[x.b.id]=[])).push(x));
  const review=all.filter(x=>x.m.comment).slice(0,3);
  const rv=review[S.reviewIdx%Math.max(1,review.length)]||review[0];
  const reviewHtml=rv?`<div class="review"><div class="kick">每 日 回 顾</div><h3>今天回来看看这条</h3><div class="q">「${esc(rv.m.text)}」</div>
    <div class="acts"><button class="btn sm" data-act="reviewnext">下一条 ›</button><button class="btn sm" data-act="jumpmark" data-id="${rv.m.id}" data-book="${rv.b.id}">回到原文</button><span class="idx">${S.reviewIdx%review.length+1} / ${review.length}</span></div></div>`:'';
  return `<div class="noteshead">
      <div class="well"><svg width="13" height="13" viewBox="0 0 14 14" fill="none"><circle cx="6" cy="6" r="4.4" stroke="currentColor" stroke-width="1.2"/><path d="M9.4 9.4L12.6 12.6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg><input data-role="notekw" placeholder="搜划线、想法、书名" value="${esc(S.noteKw)}"></div>

}

/* ─────────── 统计 ─────────── */
function heatHtml(){
  let seed=7,out='';
  for(let i=0;i<140;i++){
    seed=(seed*1103515245+12345)&0x7fffffff;
    let l=seed%5; if(i>132&&i%3===0)l=4; if(i===139)l=4;
    if(i<20)l=Math.max(0,l-1);
    out+=`<i class="l${l}" title="第 ${Math.floor(i/7)+1} 周"></i>`;
  }
  return out;
}
function rankHtml(){
  return S.books.slice().sort((a,b)=>b.minutes-a.minutes).slice(0,5).map(b=>`<div class="r"><span class="nm">${esc(b.title)}</span><div class="bar"><i style="width:${Math.round(b.minutes/310*100)}%"></i></div><em>${b.minutes} 分</em></div>`).join('');
}

  const st=S.stats, max=Math.max(...st.weekly);
  const pct=Math.min(100,Math.round(st.yearDone/st.goal*100));
  const C=2*Math.PI*52;
  return `<div class="kpis">
      <div class="k"><b>${st.streak}</b><span>连续阅读 · 天</span></div>
      <div class="k"><b>${st.yearDone}</b><span>今年读完 · 本</span></div>
      <div class="k"><b>${Math.round(st.totalMinutes/60)}</b><span>累计时长 · 小时</span></div>
      <div class="k"><b>${st.pagesToday}</b><span>今日页数 · 页</span></div>
    </div>
    <div class="stats-grid">
      <div class="card goal"><svg width="130" height="130" viewBox="0 0 130 130"><circle cx="65" cy="65" r="52" fill="none" stroke="var(--line)" stroke-width="8"/><circle cx="65" cy="65" r="52" fill="none" stroke="var(--copper)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct/100)}" transform="rotate(-90 65 65)"/><text x="65" y="62" text-anchor="middle" fill="var(--copper)" font-family="Georgia,serif" font-size="24">${pct}%</text><text x="65" y="84" text-anchor="middle" fill="var(--t3)" font-size="10">年度目标</text></svg>
        <div class="gi"><b>${st.yearDone} / ${st.goal} 本</b><span>今年还差 ${Math.max(0,st.goal-st.yearDone)} 本达成目标。<br>按当前速度，预计提前 3 周完成。</span><div style="margin-top:14px"><button class="btn sm" data-act="setgoal">调整目标</button><button class="btn sm" data-act="poster">年度海报</button></div></div></div>
      <div class="card"><div class="sect-h" style="margin:0 0 4px"><b>近 20 周</b><span class="ln"></span></div><div class="heat">${heatHtml()}</div><div class="heat-axis"><span>20 周前</span><span>本周</span></div>
        <div class="mini" style="margin-top:14px;line-height:1.9">格子越亮，那天读得越久。连续 ${st.streak} 天没有断过。</div></div>
      <div class="card"><div class="sect-h" style="margin:0 0 4px"><b>每周时长</b><span class="ln"></span></div><div class="bars">${st.weekly.map((v,i)=>`<div class="b"><i style="height:${Math.round(v/max*100)}%"></i><span>W${i+1}</span></div>`).join('')}</div>
        <div class="kv" style="margin-top:14px"><b>平均翻页速度</b><span>1 页 / 46 秒</span></div><div class="kv"><b>今日时长</b><span>${st.minutesToday} 分钟</span></div></div>
      <div class="card"><div class="sect-h" style="margin:0 0 4px"><b>按书时长</b><span class="ln"></span></div><div class="rank">${rankHtml()}</div></div>
    </div>`;
}

}

/* ==========================================================
   bz 阅读 · Obsidian 内嵌原型 · 交互层（事件 / 弹层 / 动作）
   全部用 document 上的事件委托：元素只带 data-act / data-role，
   render() 全量重绘也不会丢事件。
   ========================================================== */

/* ─────────── 弹层 ─────────── */
function modal(title, sub, body, foot, cls){
  return `<div class="scrim" id="scrim"><div class="modal ${cls||''}">
    <div class="mhead"><b>${title}</b><span class="n">${sub||''}</span><span class="sp"></span><button class="x" data-act="close">×</button></div>
    <div class="mbody">${body}</div>
    ${foot?`<div class="mfoot">${foot}</div>`:''}
  </div></div>`;
}
function openOverlay(type,payload){ S.overlay={type,...(payload||{})}; renderOverlay(); }
function closeOverlay(){ S.overlay=null; renderOverlay(); }
function renderOverlay(){
  const root=$('#overlayRoot'); if(!root)return;
  root.innerHTML = S.overlay ? overlayHtml(S.overlay) : '';
  if(S.overlay && S.overlay.type==='search'){
    const inp=root.querySelector('[data-role="searchkw"]'); if(inp)inp.focus();
  }
}
function overlayHtml(o){
  switch(o.type){
    case 'search': return overlaySearch();
    case 'import': return overlayImport();
    case 'typography': return overlayTypography();
    case 'help': return overlayHelp();
    case 'export': return overlayExport(o);
    case 'bookmap': return overlayBookmap();
    case 'film': return overlayFilm();
    case 'quote': return overlayQuote(o);
    case 'idea': return overlayIdea(o);
    case 'hlcard': return overlayHlcard(o);
    case 'ai': return overlayAI(o);
    case 'dict': return overlayDict(o);
    case 'translate': return overlayTranslate(o);
    case 'poster': return overlayPoster();
    case 'setgoal': return overlayGoal();
    case 'reset': return overlayReset();
    case 'detail': return overlayDetail(o);
    case 'settings': return overlaySettings();
    default: return '';
  }
}
function closeBtn(){ return `<span class="sp"></span><button class="btn pri" data-act="close">知道了</button>`; }

function overlaySearch(){
  const scope=RT.searchScope;
  return modal('搜索','本书 / 全库', `
    <div class="search-in"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="6" cy="6" r="4.4" stroke="var(--t3)" stroke-width="1.2"/><path d="M9.4 9.4L12.6 12.6" stroke="var(--t3)" stroke-width="1.2" stroke-linecap="round"/></svg>
      <input data-role="searchkw" placeholder="搜章节名或正文里的词…" value="${esc(RT.searchKw)}"></div>

      <span class="mini" style="margin-left:auto">命中会切到阅读 tab</span>

function overlayBookmap(){
  const b=book(S.bookId), ms=S.marks[b.id]||[], ks=S.bookmarks[b.id]||[];
  const rows=b.chapters.map((t,i)=>{
    const marks=ms.filter(m=>Math.floor(m.abs/6)===i), bks=ks.filter(k=>k.ch===i);
    const strip=`<div class="strip">${bks.map(k=>`<i style="left:${(k.pg/3)*100}%" title="书签 · ${esc(k.label)}"></i>`).join('')}${marks.map(m=>`<u style="left:${((m.abs%6)/6)*100}%;width:14%;background:${penOf(m.color).css}"></u>`).join('')}</div>`;
    return `<div class="row" data-act="jumpch" data-ch="${i}"><span class="no">${cn(i+1)}</span><span class="nm">${esc(t)}</span>${strip}<span class="mini">3 页 · ${marks.length} 划 · ${bks.length} 签</span></div>`;
  }).join('');
  return modal('Book Map','全书一屏鸟瞰', `<div class="mini" style="margin-bottom:12px">${esc(b.title)} · ${totalPages(b)} 页 · ${ks.length} 枚书签 · ${ms.length} 条划线。菱形是书签，色条是划线，点一行跳到那一章。</div><div class="bmap">${rows}</div>`, closeBtn(), 'wide tall');

function overlayHlcard(o){

/* ─────────── 搜索 ─────────── */
function hi(text,kw){
  try{ return esc(text).replace(new RegExp(kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'), m=>`<em>${m}</em>`); }
  catch(e){ return esc(text); }
}
function searchHits(){
  const kw=RT.searchKw.trim();
  if(!kw)return `<div class="empty">输入关键词，搜章节名与正文。<br>「本书」只搜当前这本，「全库」翻遍所有书。</div>`;
  const bs=RT.searchScope==='book'?[book(S.bookId)]:S.books;
  let out='',count=0;
  for(const b of bs){
    const hits=[],seen=new Set();
    for(let ch=0;ch<b.chapters.length;ch++){
      for(let pg=0;pg<3;pg++)for(let i=0;i<2;i++){
        const abs=absOf(ch,pg,i),text=paraAt(b,abs),key=ch+':'+pg;
        if(seen.has(key))continue;
        if(text.toLowerCase().includes(kw.toLowerCase())||b.chapters[ch].includes(kw)){
          seen.add(key);
          hits.push({ch,pg,text:text.slice(0,72)+'…'});
        }
      }
    }
    if(hits.length){
      count+=hits.length;
      out+=`<div class="hitgroup">${esc(b.title)} · ${hits.length} 处</div>`+hits.slice(0,9).map(h=>
        `<button class="hit" data-act="searchhit" data-book="${b.id}" data-ch="${h.ch}" data-pg="${h.pg}"><span class="loc">第 ${cn(h.ch+1)} 章 · ${esc(b.chapters[h.ch])} · 第 ${h.pg+1} 页</span>${hi(h.text,kw)}</button>`).join('');
    }
  }
  return count?out:`<div class="empty">没有找到「${esc(kw)}」</div>`;
}

/* ─────────── 导出 ─────────── */
function exportMd(bookId){
  const bs=bookId?[book(bookId)]:S.books;
  let md='';
  for(const b of bs){
    const ms=S.marks[b.id]||[]; if(!ms.length)continue;
    md+=`# ${b.title} · 摘录\n\n> ${b.author} · ${b.format}\n\n`;
    const groups={}; ms.forEach(m=>(groups[m.ch]||(groups[m.ch]=[])).push(m));
    for(const ch of Object.keys(groups).sort((a,c)=>a-c)){
      md+=`## ${cn(Number(ch)+1)} · ${b.chapters[ch]}\n\n`;
      for(const m of groups[ch]){
        md+=`> ${m.text}\n\n`;
        if(m.comment)md+=`**${m.type||'想法'}**：${m.comment}\n\n`;
        md+=`— 第 ${Math.floor(m.abs/3)+1} 页 · [↪ 回到原文](obsidian://open?book=${b.id}#cfi=para-${m.abs})\n\n`;
      }
    }
  }
  return md||'（还没有划线。去阅读页选中一段文字试试。）';
}

  RT.sel={text:sel.toString().trim(),abs:Number(para.dataset.abs),bookId:S.bookId,ch:S.chapter,pg:S.page};
}

/* ─────────── 事件委托 ─────────── */
function onClick(e){
  if(e.target.id==='scrim'){ closeOverlay(); return; }
  const el=e.target.closest('[data-act]');
  if(!el){ if(!e.target.closest('#selbar'))closeSelbar(); return; }
  const a=el.dataset.act, d=el.dataset;
  switch(a){
    case 'noop': break;
    case 'close': closeOverlay(); break;
    /* 承载 */
    case 'rib': rib(d.go); break;
    case 'tab': switchTab(d.go); break;
    case 'closetab': closeTab(d.go); break;
    case 'study': goStudy(d.p); break;
    case 'left': toggleLeft(); break;
    case 'focus': toggleFocus(); break;
    case 'theme': cycleTheme(); break;
    case 'help': openOverlay('help'); break;
    case 'import': openOverlay('import'); break;
    case 'search': openOverlay('search'); break;
    case 'osetother': toast('原型只演示「bz 阅读」这一栏的设置'); break;
    case 'sbtab': S.sideTab=d.tab; S.leftOpen=true; save(); render(); break;
    case 'addbookmark': addBookmark(); break;
    case 'typography': openOverlay('typography'); break;
    case 'parallel': S.parallel=!S.parallel; render(); break;
    case 'tts': toggleTts(); break;
    case 'bookmap': openOverlay('bookmap'); break;
    case 'film': openOverlay('film'); break;
    case 'poster': openOverlay('poster'); break;
    case 'setgoal': openOverlay('setgoal'); break;
    case 'reset': openOverlay('reset'); break;
    case 'resetyes': try{localStorage.removeItem(LS_KEY);}catch(e2){} location.reload(); break;
    case 'tour': tourTo(d.go); break;
    /* 书库 */
    case 'detail': openOverlay('detail',{id:d.id}); break;
    case 'openbook': openBook(d.id); break;
    case 'fav': { const b=book(d.id); b.fav=!b.fav; save(); render(); toast(b.fav?'已收藏':'已取消收藏'); break; }
    case 'done': { const b=book(d.id); b.status=b.status==='done'?'reading':'done'; if(b.status==='done'){b.percent=100;S.stats.yearDone++;} else b.percent=Math.min(b.percent,99); save(); render(); toast(b.status==='done'?'已标记读完':'已标记在读'); break; }
    case 'libfilter': S.libFilter=d.v; renderStage(); break;
    case 'libview': S.libView=d.v; renderStage(); break;
    case 'shelf': S.libShelf=d.v; renderStage(); break;
    case 'detailjump': { const b=book(d.id); closeOverlay(); S.bookId=d.id; S.chapter=Number(d.ch); S.page=0; S.tab='reader'; S.leftOpen=true; S.sideTab='toc'; save(); render(); break; }
    /* 阅读 */
    case 'next': goNext(); break;
    case 'prev': goPrev(); break;
    case 'track': { const tr=el.getBoundingClientRect(), ratio=clamp((e.clientX-tr.left)/tr.width,0,.999); gotoPage(Math.floor(ratio*totalPages(book(S.bookId)))); break; }
    case 'jumpch': closeOverlay(); S.chapter=Number(d.ch); S.page=0; S.tab='reader'; book(S.bookId).percent=pctOf(book(S.bookId)); save(); render(); break;
    case 'jumpbookmark': { const k=(S.bookmarks[book(S.bookId).id]||[]).find(x=>x.id===d.id); if(k){S.tab='reader';S.chapter=k.ch;S.page=k.pg;save();render();toast('跳到书签 · '+k.label);} break; }
    case 'delbookmark': { const id=d.id,bid=book(S.bookId).id; S.bookmarks[bid]=(S.bookmarks[bid]||[]).filter(x=>x.id!==id); save(); render(); toast('书签已删'); break; }
    case 'filmpage': gotoPage(Number(d.n)); closeOverlay(); break;
    /* 标注 */
    case 'hlcard': openOverlay('hlcard',{id:d.id,bookId:d.book||S.bookId}); break;
    case 'delmark': removeMark(d.id,book(S.bookId).id); toast('划线已删'); break;
    case 'hljump': { const m=findMark(d.id,d.book); if(m){closeOverlay();jumpToAbs(d.book,m.abs);} break; }
    case 'hlidea': { const m=findMark(d.id,d.book); if(m){RT.ideaType=m.type||'笔记';openOverlay('idea',{id:d.id,bookId:d.book});} break; }
    case 'hlquote': { const m=findMark(d.id,d.book); if(m)openOverlay('quote',{text:m.text,bookId:d.book,ch:m.ch,pg:absToPos(m.abs).pg}); break; }
    case 'hlcolor': { const m=findMark(d.id,d.book); if(m){m.color=d.v;save();render();toast('换成'+penOf(d.v).label);} break; }
    case 'hldel': { closeOverlay(); removeMark(d.id,d.book); toast('划线已删'); break; }
    case 'ideatype': RT.ideaType=d.v; renderOverlay(); break;
    case 'ideasave': { const m=findMark(d.id,d.book), ta=$('[data-role="idea"]'); if(m){m.comment=ta?ta.value.trim():'';m.type=RT.ideaType;save();closeOverlay();render();toast('想法已保存');} break; }
    case 'jumpmark': { const m=findMark(d.id,d.book); if(m){closeOverlay();jumpToAbs(d.book,m.abs);} break; }
    case 'reviewnext': S.reviewIdx++; renderStage(); break;
    /* 笔记 / 统计 */
    case 'notefilter': S.noteFilter=d.v; renderStage(); break;
    case 'export': openOverlay('export',{bookId:d.id||null}); break;
    case 'copymd': copyText(exportMd(d.book||null)); break;
    case 'copytext': copyText(d.text); break;
    case 'copyquote': copyText(`「${d.text}」\n— ${book(d.book).title} · ${book(d.book).author} · 第 ${cn(Number(d.ch)+1)} 章\n[↪ 回到原文](obsidian://open?book=${d.book}#cfi=para-${d.pg})`); break;
    /* 设置 */
    case 'set': actSet(d.k,d.v); break;
    case 'toggle': S.settings[d.k]=!S.settings[d.k]; save(); render(); break;
    /* 搜索 */
    case 'searchscope': RT.searchScope=d.v; renderOverlay(); break;
    case 'searchhit': { S.bookId=d.book; S.chapter=Number(d.ch); S.page=Number(d.pg); S.tab='reader'; S.focus=false; closeOverlay(); save(); render(); toast('已跳到命中位置'); break; }
    /* 划词 */
    case 'selpen': addMark(d.v); break;
    case 'selidea': { const m=addMark(S.settings.pen); if(m){RT.ideaType='笔记';openOverlay('idea',{id:m.id,bookId:m.bookId});} break; }
    case 'selquote': { if(RT.sel)openOverlay('quote',{text:RT.sel.text,bookId:RT.sel.bookId,ch:RT.sel.ch,pg:RT.sel.pg}); closeSelbar(); break; }
    case 'seldict': { if(RT.sel)openOverlay('dict',{word:RT.sel.text.slice(0,6)}); closeSelbar(); break; }
    case 'seltranslate': { if(RT.sel)openOverlay('translate',{text:RT.sel.text}); closeSelbar(); break; }
    case 'selai': { if(RT.sel)openOverlay('ai',{mode:'解释',text:RT.sel.text}); closeSelbar(); break; }
    case 'selcopy': { if(RT.sel)copyText(RT.sel.text); closeSelbar(); break; }
    /* AI / 词典 / 导入 */
    case 'aimode': S.overlay.mode=d.v; renderOverlay(); break;
    case 'aiask': { const inp=$('[data-role="aiask"]'),q=inp?inp.value.trim():''; if(!q)break;
      RT.aiLog.push({me:true,text:q}); RT.aiLog.push({me:false,tag:'AI · 本地模型',text:aiAnswer('解释',q)+'（仅引用当前位置之前的内容）'});
      if(RT.aiLog.length>8)RT.aiLog=RT.aiLog.slice(-8); render(); break; }
    case 'aisave': { toast('已存进笔记页 · 可导出为 Markdown'); closeOverlay(); break; }
    case 'dictsave': { (S.vocab||(S.vocab=[])).push(d.word); save(); closeOverlay(); toast('「'+d.word+'」已加入生词本'); break; }
    case 'addsample': addSampleBook(); break;
    default: break;
  }
}
function onInput(e){
  const t=e.target, role=t.dataset.role, k=t.dataset.k;
  if(role==='libkw'){ S.libKw=t.value; renderStage(); const n=$('[data-role="libkw"]'); if(n){n.focus();n.setSelectionRange(t.value.length,t.value.length);} return; }
  if(role==='notekw'){ S.noteKw=t.value; renderStage(); const n=$('[data-role="notekw"]'); if(n){n.focus();n.setSelectionRange(t.value.length,t.value.length);} return; }
  if(role==='searchkw'){ RT.searchKw=t.value; const h=$('#hitlist'); if(h)h.innerHTML=searchHits(); return; }
  if(role==='set'){
    const nums=['size','leading','width','gap','ttsRate','ttsSleep'];
    S.settings[k]=nums.includes(k)?Number(t.value):t.value;
    if(k==='sort')S.libSort=t.value;
    applySettings();
    const v=t.parentElement&&t.parentElement.querySelector('.val'); if(v)v.textContent=fmtSetVal(k,t.value);
    save(); if(k==='mode')renderStage(); return;
  }
  if(role==='goal'){ S.stats.goal=Number(t.value); const v=$('#goalval'); if(v)v.textContent=t.value+' 本'; save(); return; }
  if(role==='parallelbook'){ S.parallelId=t.value; render(); return; }
  if(role==='libsort'){ S.libSort=t.value; S.settings.sort=t.value; save(); renderStage(); return; }
  if(role==='idea')return;
}
function onKeydown(e){
  const t=e.target, typing=t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT');
  if(e.key==='Escape'){
    if(document.getElementById('selbar')){closeSelbar();return;}
    if(S.overlay){closeOverlay();return;}
    if(S.focus){S.focus=false;save();render();return;}
    return;
  }
  if(typing){
    if(e.key==='Enter'&&t.dataset.role==='aiask'){e.preventDefault();const q=t.value.trim();if(q){RT.aiLog.push({me:true,text:q});RT.aiLog.push({me:false,tag:'AI · 本地模型',text:aiAnswer('解释',q)});render();}}
    return;
  }
  switch(e.key){
    case '/': e.preventDefault(); openOverlay('search'); break;
    case 'f': toggleFocus(); break;
    case 'g': switchTab(S.tab==='study'?'reader':'study'); break;
    case 's': toggleLeft(); break;
    case 'b': if(S.tab==='reader')addBookmark(); break;
    case 't': if(S.tab==='reader')openOverlay('typography'); break;
    case 'm': if(S.tab==='reader')openOverlay('bookmap'); break;
    case 'r': if(S.tab==='reader')toggleTts(); break;
    case '?': openOverlay('help'); break;
    case 'ArrowRight': if(S.tab==='reader'&&!S.overlay){e.preventDefault();goNext();} break;
    case 'ArrowLeft': if(S.tab==='reader'&&!S.overlay){e.preventDefault();goPrev();} break;
  }
}
function onMouseup(e){
  if(e.target.closest('#selbar'))return;
  if(!e.target.closest('.rpages'))return;
  setTimeout(showSelbar,0);
}
function onDrag(e){
  const drop=$('[data-role="drop"]'); if(!drop)return;
  if(e.type==='dragover'){ e.preventDefault(); drop.classList.add('over'); }
  if(e.type==='dragleave'){ drop.classList.remove('over'); }
  if(e.type==='drop'){
    e.preventDefault(); drop.classList.remove('over');
    const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];
    if(f)addBookFromFile(f.name);
  }
}
function init(){
  if(!load())seed();
  if(!Object.keys(S.marks).length)seed();
  S.vocab=S.vocab||[];
  render();
  document.addEventListener('click',onClick);
  document.addEventListener('input',onInput);
  document.addEventListener('change',onInput);
  document.addEventListener('keydown',onKeydown);
  document.addEventListener('mouseup',onMouseup);
  document.addEventListener('dragover',onDrag);
  document.addEventListener('dragleave',onDrag);
  document.addEventListener('drop',onDrag);
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init); else init();

</script>
</body>
