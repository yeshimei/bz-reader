<!doctype html>
<html lang="zh-CN" data-theme="light" data-state="off" data-variant="new" data-page-node-id="gKJ5CLfWxn5yhNDu6OhWuV">
<head data-page-node-id="mbtwWKcnx6LJSqns9CISik">
<meta charset="utf-8" data-page-node-id="CA715YSYF1EVkOyii8AYD9">
<meta name="viewport" content="width=device-width,initial-scale=1" data-page-node-id="pGehdQTRknVObUPbnJolUV">
<title>原型 · 连接至 BZ AI 知识库</title>
<style>
  :root {
    --ui: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --serif: Georgia, "Times New Roman", "STZhongsong", "SimSun", "Songti SC", serif;
    --bg: #ffffff;
    --surface: #fafafa;
    --sunken: #f0f0f2;
    --line: rgba(0, 0, 0, .10);
    --line-2: rgba(0, 0, 0, .18);
    --t1: #1f1f23;
    --t2: #5a5a63;
    --t3: #93939c;
    --copper: #7856d6;
    --ok: #4c8a63;
  }
  html[data-theme="dark"] {
    --bg: #1e1e1e;
    --surface: #242424;
    --sunken: #1a1a1a;
    --line: rgba(255, 255, 255, .10);
    --line-2: rgba(255, 255, 255, .18);
    --t1: #dcddde;
    --t2: #b3b3b3;
    --t3: #8a8a8a;
    --copper: #8a72e0;
    --ok: #7fbf95;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--t1);
    font-family: var(--ui);
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px 96px;
    transition: background .18s ease, color .18s ease;
  }
  .stage { width: 520px; max-width: 100%; }
  .cap {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin: 0 2px 10px;
    font-size: 11px;
    letter-spacing: .06em;
    color: var(--t3);
  }
  .cap b { color: var(--t2); font-weight: 500; font-size: 12px; }

  .panel {
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
    padding: 16px 18px;
  }
  h3 {
    font-family: var(--serif);
    font-size: 15px;
    font-weight: 500;
    margin: 0 0 4px;
    letter-spacing: .06em;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 9px 0;
    font-size: 12px;
  }
  .row + .row, .sep + .row { border-top: 1px solid var(--line); }
  .row > label {
    color: var(--t2);
    min-width: 86px;
    flex-shrink: 0;
    letter-spacing: .05em;
    white-space: nowrap;
  }
  .sep { border-top: 1px solid var(--line); margin: 8px 0; }

  .state {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--t3);
    letter-spacing: .03em;
  }
  .state .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: currentColor;
    opacity: .5;
  }
  .state.on { color: var(--ok); }
  .state.on .dot { opacity: 1; }
  .state .m { color: var(--t2); }

  .mini {
    font-size: 11px;
    color: var(--t3);
    line-height: 1.75;
    margin: 0 0 8px;
    max-width: 42em;
  }
  .acts { display: flex; gap: 8px; margin: 2px 0 2px; }
  .acts:last-child { margin-bottom: 0; }

  .btn {
    appearance: none;
    border: 1px solid var(--line-2);
    background: transparent;
    color: var(--t2);
    border-radius: 6px;
    padding: 6px 11px;
    font-size: 12px;
    font-family: inherit;
    letter-spacing: .08em;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    white-space: nowrap;
    transition: background .15s ease, border-color .15s ease, color .15s ease;
  }
  .btn:hover { color: var(--t1); border-color: color-mix(in srgb, var(--copper) 38%, transparent); background: color-mix(in srgb, var(--copper) 12%, transparent); }
  .btn.pri {
    color: var(--copper);
    border-color: color-mix(in srgb, var(--copper) 38%, transparent);
    background: color-mix(in srgb, var(--copper) 12%, transparent);
  }
  .btn.pri:hover { color: var(--t1); }
  .btn svg { width: 11px; height: 11px; flex-shrink: 0; }

  .note {
    margin: 12px 2px 0;
    font-size: 11px;
    line-height: 1.85;
    color: var(--t3);
  }
  .note b { color: var(--t2); font-weight: 500; }

  .bar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    justify-content: center;
    padding: 14px 16px;
    border-top: 1px solid var(--line);
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(8px);
  }
  .grp { display: flex; align-items: center; gap: 8px; }
  .grp > span { font-size: 10px; letter-spacing: .1em; color: var(--t3); }
  .seg {
    display: flex;
    gap: 3px;
    padding: 3px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--sunken);
  }
  .seg button {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--t3);
    font-family: inherit;
    font-size: 11px;
    letter-spacing: .06em;
    padding: 5px 10px;
    border-radius: 7px;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .seg button:hover { color: var(--t2); }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--t1); }
</style>
</head>
<body data-page-node-id="WuZ0ujZYRAdcaUIV6rHhN4">
  <div class="stage" data-page-node-id="cRiKZYy27vSpKaivpj1zUC">
    <div class="cap" data-page-node-id="QkHxxa4YsVl01gS8nQA1DP"><b id="capTitle" data-page-node-id="xmlGWB6G1GaFel2wVr2VgD">改后 · 未连接</b><span data-page-node-id="AlScWA5Rkj7S4rvvVlsVWG">bz-reader 设置页 · AI 组</span></div>
    <div class="panel" id="panel" data-page-node-id="b7VpYy7pBXfd7bXRS1BbSe"></div>
    <div class="note" id="note" data-page-node-id="FciWGOBqNapAuiZsKT14LZ"></div>
  </div>

  <div class="bar" data-page-node-id="LMOr4AqA8sCZ0SuvKxDMt2">
    <div class="grp" data-page-node-id="4I2OfRTNjjllLsrmRsXJBt"><span data-page-node-id="RC3vzcs4qqe7OJKOpJMAdD">版本</span>
      <div class="seg" data-k="variant" data-page-node-id="fCx9UKgvt5r4OSeHJICHM7">
        <button data-v="new" aria-pressed="true" data-page-node-id="b3clsUO29E57IYk9X9MN5j">改后</button>
        <button data-v="old" aria-pressed="false" data-page-node-id="y5c68D96Bz3uPf4Ep3HBab">改前</button>
      </div>
    </div>
    <div class="grp" data-page-node-id="mX41StiZEIA1W5ev2L0Yku"><span data-page-node-id="Wh0xmt0WhsxX1TTTupkr4v">连接</span>
      <div class="seg" data-k="state" data-page-node-id="SINrzkh4S9BTZzR8pdd0nz">
        <button data-v="off" aria-pressed="true" data-page-node-id="pzPinHkhP3bT31i0kbjtQZ">未连接</button>
        <button data-v="on" aria-pressed="false" data-page-node-id="vaB6eqrNF1xOGdsF89clhN">已连接</button>
      </div>
    </div>
    <div class="grp" data-page-node-id="I9MkaOBuSVTcD7vA9bbR23"><span data-page-node-id="rVnirNLrgLClfuTkaLoLHI">主题</span>
      <div class="seg" data-k="theme" data-page-node-id="pL59LJfoS1TkZJKCROyuDU">
        <button data-v="light" aria-pressed="true" data-page-node-id="VwJkSPVCE7hEDQs1uuHGHA">纸色</button>
        <button data-v="dark" aria-pressed="false" data-page-node-id="xDdlAxpZsFS54hzKnASkxN">墨色</button>
      </div>
    </div>
  </div>

<script>
const root = document.documentElement;
const panel = document.getElementById('panel');
const note = document.getElementById('note');
const capTitle = document.getElementById('capTitle');

const PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg>';

function rowNew(on) {
  return `<div class="row"><label>连接至 BZ AI 知识库</label>
    <span class="state${on ? ' on' : ''}"><i class="dot"></i>${on ? '已连接' : '未连接'}</span></div>`;
}

function viewNew(on) {
  return `${rowNew(on)}
    <div class="mini"${on ? ' style="margin-bottom:0"' : ''}>在划词中添加存为名词 / 存为段落，可以为书籍建立本地向量化索引，提问时会一并参考库里的笔记。</div>
    ${on ? '' : `<div class="acts"><button class="btn pri">${PLAY}观看视频教程</button></div>`}`;
}

function viewOld() {
  return `<div class="row" style="padding-top:0"><label>向量库</label>
      <span class="state">未检测到第二大脑</span></div>
    <div class="mini">装上并启用 bz、在它的设置里选好嵌入模型，才能建索引。</div>
    <div class="mini">未检测到第二大脑（bz）：划词与提问都只用到这本书。</div>
    <div class="sep"></div>
    <div class="row" style="padding-bottom:0;border-top:0"><label>全书画像</label>
      <button class="btn">清理无主画像</button></div>`;
}

const NOTE = {
  'new-off': '<b>未连接</b>：行标签换成「连接至 BZ AI 知识库」，状态退成灰字「未连接」；下面一句话说清这个库能干什么，再给一个「观看视频教程」的出口。「全书画像」整行（含「清理无主画像」）已去掉。',
  'new-on': '<b>已连接</b>：状态转绿，教程按钮收起——能连上的人不需要它；功能说明两种状态共用同一句，不随连接变化。',
  'old-off': '<b>改前</b>：两段灰字各说一半，第一段讲安装、第二段讲代价，品牌词「第二大脑」出现两次；「全书画像 / 清理无主画像」占一整行。',
};

function render() {
  const v = root.dataset.variant;
  const on = root.dataset.state === 'on';
  panel.innerHTML = v === 'new' ? viewNew(on) : viewOld();
  note.innerHTML = NOTE[v === 'new' ? (on ? 'new-on' : 'new-off') : 'old-off'];
  capTitle.textContent = (v === 'new' ? '改后' : '改前') + ' · ' + (v === 'new' ? (on ? '已连接' : '未连接') : '未连接');
}

document.querySelectorAll('.seg').forEach((seg) => {
  seg.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    const k = seg.dataset.k;
    const val = b.dataset.v;
    if (k === 'theme') root.dataset.theme = val;
    else root.dataset[k] = val;
    seg.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    render();
  });
});

render();
</script>
</body>
</html>
