# bz-reader 激活服务（Cloudflare Worker + D1）
#
# 首次部署：
#   npx wrangler d1 create bz-license
#   → 把返回的 database_id 填到下面
#   npx wrangler d1 execute bz-license --file=server/schema.sql --remote
#   npx wrangler secret put TOKEN_PRIVATE_KEY     # 粘 scripts/keys/token-private.pem 全文
#   npx wrangler deploy
#
# 本地联调：
#   npx wrangler dev --local

name = "bz-license"
main = "worker.mjs"
compatibility_date = "2026-11-01"

[[d1_databases]]
binding = "DB"
database_name = "bz-license"
database_id = "REPLACE_WITH_YOUR_D1_ID"

[vars]
# 发行公钥（scripts/keys/public-spki.b64）。公开无妨：它只能验签，签不出码。
CODE_PUBKEY = "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEDlauLuKMfRhggbifaU3QcR1R+gX7518ibeYfPeyFzLYcQesrjY0vViS/SukngZqMZDPwBbebtPoGqw/pLJRnxg=="
